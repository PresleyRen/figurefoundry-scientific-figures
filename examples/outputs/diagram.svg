<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="180mm" height="85mm" viewBox="0 0 180 85" version="1.1" role="img" aria-labelledby="figure-title">
  <title id="figure-title">Retrieval-augmented agent: explicit topology</title>
  <desc>Native editable vector diagram; connections follow the supplied specification. Dashed directed edges indicate feedback.</desc>
  <defs>
    <marker id="edge-arrow" markerWidth="4" markerHeight="4" refX="3.5" refY="2" orient="auto" markerUnits="strokeWidth" viewBox="0 0 4 4">
      <path d="M 0 0 L 4 2 L 0 4 Z" fill="#516172" />
    </marker>
    <marker id="edge-arrow-start" markerWidth="4" markerHeight="4" refX="0.5" refY="2" orient="auto" markerUnits="strokeWidth" viewBox="0 0 4 4">
      <path d="M 4 0 L 0 2 L 4 4 Z" fill="#516172" />
    </marker>
  </defs>
  <g id="diagram-groups">
    <g id="group-1-resources">
      <rect x="77.5" y="56.5" width="98" height="26.5" rx="2" fill="#F7F9FC" stroke="#C5CDD8" stroke-width="0.25" stroke-dasharray="1.2 0.9" />
      <text x="79.5" text-anchor="start" font-family="Arial, Helvetica, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="2.469444" fill="#536274" font-weight="normal" aria-label="Resources"><tspan x="79.5" y="60.339611">Resources</tspan></text></g>
  </g>
  <g id="diagram-edges">
    <g id="edge-1-question-to-planner" data-kind="forward">
      <title>question → planner (forward)</title>
      <path d="M 31 39 L 42 39" fill="none" stroke="#516172" stroke-width="0.38" stroke-linejoin="round" marker-end="url(#edge-arrow)" />
    </g>
    <g id="edge-2-planner-to-retriever" data-kind="forward">
      <title>planner → retriever (forward)</title>
      <path d="M 72 39 L 83 39" fill="none" stroke="#516172" stroke-width="0.38" stroke-linejoin="round" marker-end="url(#edge-arrow)" />
    </g>
    <g id="edge-3-retriever-to-generator" data-kind="forward">
      <title>retriever → generator (forward)</title>
      <path d="M 116 39 L 131 39" fill="none" stroke="#516172" stroke-width="0.38" stroke-linejoin="round" marker-end="url(#edge-arrow)" />
    </g>
    <g id="edge-4-vector_index-to-retriever" data-kind="forward">
      <title>vector_index → retriever (forward)</title>
      <path d="M 99.121212 64 L 99.363636 48" fill="none" stroke="#516172" stroke-width="0.38" stroke-linejoin="round" marker-end="url(#edge-arrow)" />
    </g>
    <g id="edge-5-tools-to-generator" data-kind="bidirectional">
      <title>tools → generator (bidirectional)</title>
      <path d="M 154.651515 64 L 152.954545 48" fill="none" stroke="#516172" stroke-width="0.38" stroke-linejoin="round" marker-end="url(#edge-arrow)" marker-start="url(#edge-arrow-start)" />
    </g>
    <g id="edge-6-generator-to-planner" data-kind="feedback">
      <title>generator → planner (feedback)</title>
      <path d="M 152 30 L 152 22 L 57 22 L 57 30" fill="none" stroke="#516172" stroke-width="0.38" stroke-linejoin="round" stroke-dasharray="1.5 1" marker-end="url(#edge-arrow)" />
    </g>
  </g>
  <g id="diagram-edge-labels">
    <g id="edge-3-retriever-to-generator-label">
      <rect x="117.400597" y="35.365278" width="12.198806" height="3.669444" rx="0.8" fill="white" opacity="0.96" />
      <text x="123.5" text-anchor="middle" font-family="Arial, Helvetica, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="2.469444" fill="#22313F" font-weight="normal" aria-label="context"><tspan x="123.5" y="38.039611">context</tspan></text></g>
    <g id="edge-6-generator-to-planner-label">
      <rect x="86.646042" y="18.165278" width="35.707917" height="3.669444" rx="0.8" fill="white" opacity="0.96" />
      <text x="104.5" text-anchor="middle" font-family="Arial, Helvetica, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="2.469444" fill="#22313F" font-weight="normal" aria-label="evidence check / feedback"><tspan x="104.5" y="20.839611">evidence check / feedback</tspan></text></g>
  </g>
  <g id="diagram-nodes">
    <g id="node-1-question" data-node-id="question">
      <title>Question</title>
      <rect x="6" y="30" width="25" height="18" rx="1.8" fill="#EAF2F8" stroke="#516172" stroke-width="0.32" />
      <text x="18.5" text-anchor="middle" font-family="Arial, Helvetica, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="2.822222" fill="#22313F" font-weight="normal" aria-label="Question"><tspan x="18.5" y="39.959556">Question</tspan></text></g>
    <g id="node-2-planner" data-node-id="planner">
      <title>Agent
planner</title>
      <rect x="42" y="30" width="30" height="18" rx="1.8" fill="#FBEDEC" stroke="#516172" stroke-width="0.32" />
      <text x="57" text-anchor="middle" font-family="Arial, Helvetica, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="2.822222" fill="#22313F" font-weight="normal" aria-label="Agent&#10;planner"><tspan x="57" y="38.153333">Agent</tspan>
<tspan x="57" y="41.765778">planner</tspan></text></g>
    <g id="node-3-retriever" data-node-id="retriever">
      <title>Evidence
retrieval</title>
      <rect x="83" y="30" width="33" height="18" rx="1.8" fill="#E8F1EC" stroke="#516172" stroke-width="0.32" />
      <text x="99.5" text-anchor="middle" font-family="Arial, Helvetica, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="2.822222" fill="#22313F" font-weight="normal" aria-label="Evidence&#10;retrieval"><tspan x="99.5" y="38.153333">Evidence</tspan>
<tspan x="99.5" y="41.765778">retrieval</tspan></text></g>
    <g id="node-4-generator" data-node-id="generator">
      <title>Answer with
source citations</title>
      <rect x="131" y="30" width="42" height="18" rx="1.8" fill="#EEEAF7" stroke="#516172" stroke-width="0.32" />
      <text x="152" text-anchor="middle" font-family="Arial, Helvetica, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="2.822222" fill="#22313F" font-weight="normal" aria-label="Answer with&#10;source citations"><tspan x="152" y="38.153333">Answer with</tspan>
<tspan x="152" y="41.765778">source citations</tspan></text></g>
    <g id="node-5-vector_index" data-node-id="vector_index">
      <title>Curated corpus
Vector index</title>
      <path d="M 79 66.4 A 20 2.4 0 0 1 119 66.4 L 119 77.6 A 20 2.4 0 0 1 79 77.6 Z" fill="#FFF3DB" stroke="#516172" stroke-width="0.32" />
      <ellipse cx="99" cy="66.4" rx="20" ry="2.4" fill="#FFF3DB" stroke="#516172" stroke-width="0.32" />
      <text x="99" text-anchor="middle" font-family="Arial, Helvetica, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="2.822222" fill="#22313F" font-weight="normal" aria-label="Curated corpus&#10;Vector index"><tspan x="99" y="71.153333">Curated corpus</tspan>
<tspan x="99" y="74.765778">Vector index</tspan></text></g>
    <g id="node-6-tools" data-node-id="tools">
      <title>Tools / APIs</title>
      <rect x="138" y="64" width="35" height="16" rx="0" fill="#F3F5F7" stroke="#516172" stroke-width="0.32" />
      <text x="155.5" text-anchor="middle" font-family="Arial, Helvetica, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="2.822222" fill="#22313F" font-weight="normal" aria-label="Tools / APIs"><tspan x="155.5" y="72.959556">Tools / APIs</tspan></text></g>
  </g>
  <g id="diagram-heading">
    <text x="90" text-anchor="middle" font-family="Arial, Helvetica, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="3.175" fill="#22313F" font-weight="bold" aria-label="Retrieval-augmented agent: explicit topology"><tspan x="90" y="6.5795">Retrieval-augmented agent: explicit topology</tspan></text></g>
</svg>