name: Scientific figure checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-figure-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-10-20
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, verified 2026-10-20
        with:
          python-version: '3.12'
          cache: pip
      - name: Install tested data-plotting dependencies
        run: python -m pip install -r requirements-tested.txt
      - name: Validate skill, module index, source syntax and local documentation links
        run: python tools/check_package.py
      - name: Run numerical, export, SVG, diagram and CLI contracts
        run: python -m unittest discover -s tests -v
      - name: Rebuild synthetic examples
        run: python examples/generate_examples.py
      - name: Exercise four Seaborn grid recipes through the SVG exporter
        run: python examples/custom_seaborn.py --out /tmp/figurefoundry-seaborn
