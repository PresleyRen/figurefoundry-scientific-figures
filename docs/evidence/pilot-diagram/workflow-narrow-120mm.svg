<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="120mm" height="94mm" viewBox="0 0 120 94" version="1.1" role="img" aria-labelledby="figure-title">
  <title id="figure-title">Scientific diagram</title>
  <desc>Native editable vector diagram; connections follow the supplied specification. Dashed directed edges indicate feedback.</desc>
  <defs>
    <marker id="edge-arrow" markerWidth="4" markerHeight="4" refX="3.5" refY="2" orient="auto" markerUnits="strokeWidth" viewBox="0 0 4 4">
      <path d="M 0 0 L 4 2 L 0 4 Z" fill="#516172" />
    </marker>
    <marker id="edge-arrow-start" markerWidth="4" markerHeight="4" refX="0.5" refY="2" orient="auto" markerUnits="strokeWidth" viewBox="0 0 4 4">
      <path d="M 4 0 L 0 2 L 4 4 Z" fill="#516172" />
    </marker>
  </defs>
  <g id="diagram-groups" />
  <g id="diagram-edges">
    <g id="edge-1-specimen-to-preparation" data-kind="forward">
      <title>specimen → preparation (forward)</title>
      <path d="M 33 43 L 43 43" fill="none" stroke="#516172" stroke-width="0.38" stroke-linejoin="round" marker-end="url(#edge-arrow)" />
    </g>
    <g id="edge-2-preparation-to-assay" data-kind="forward">
      <title>preparation → assay (forward)</title>
      <path d="M 74 43 L 85 43" fill="none" stroke="#516172" stroke-width="0.38" stroke-linejoin="round" marker-end="url(#edge-arrow)" />
    </g>
    <g id="edge-3-assay-to-analysis" data-kind="forward">
      <title>assay → analysis (forward)</title>
      <path d="M 99.5 50 L 99.5 66" fill="none" stroke="#516172" stroke-width="0.38" stroke-linejoin="round" marker-end="url(#edge-arrow)" />
    </g>
    <g id="edge-4-analysis-to-result" data-kind="forward">
      <title>analysis → result (forward)</title>
      <path d="M 85 73 L 74 73" fill="none" stroke="#516172" stroke-width="0.38" stroke-linejoin="round" marker-end="url(#edge-arrow)" />
    </g>
    <g id="edge-5-assay-to-quality-control" data-kind="forward">
      <title>assay → quality-control (forward)</title>
      <path d="M 99.5 36 L 99.5 14 L 81 14 L 74 14" fill="none" stroke="#516172" stroke-width="0.38" stroke-linejoin="round" marker-end="url(#edge-arrow)" />
    </g>
    <g id="edge-6-quality-control-to-preparation" data-kind="feedback">
      <title>quality-control → preparation (feedback)</title>
      <path d="M 58.5 21 L 58.5 28.5 L 58.5 36" fill="none" stroke="#516172" stroke-width="0.38" stroke-linejoin="round" stroke-dasharray="1.5 1" marker-end="url(#edge-arrow)" />
    </g>
    <g id="edge-7-reference-database-to-analysis" data-kind="forward">
      <title>reference-database → analysis (forward)</title>
      <path d="M 19.5 82 L 19.5 88 L 99.5 88 L 99.5 80" fill="none" stroke="#516172" stroke-width="0.38" stroke-linejoin="round" marker-end="url(#edge-arrow)" />
    </g>
  </g>
  <g id="diagram-edge-labels">
    <g id="edge-6-quality-control-to-preparation-label">
      <rect x="46.399847" y="24.865278" width="24.200306" height="3.669444" rx="0.8" fill="white" opacity="0.96" />
      <text x="58.5" text-anchor="middle" font-family="Arial, Helvetica, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="2.469444" fill="#22313F" font-weight="normal" aria-label="Recheck required"><tspan x="58.5" y="27.539611">Recheck required</tspan></text></g>
  </g>
  <g id="diagram-nodes">
    <g id="node-1-specimen" data-node-id="specimen">
      <title>Specimen</title>
      <ellipse cx="19" cy="43" rx="14" ry="7" fill="#EAF2F8" stroke="#516172" stroke-width="0.32" />
      <text x="19" text-anchor="middle" font-family="Arial, Helvetica, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="2.998611" fill="#22313F" font-weight="normal" aria-label="Specimen"><tspan x="19" y="44.019528">Specimen</tspan></text></g>
    <g id="node-2-preparation" data-node-id="preparation">
      <title>Preparation</title>
      <rect x="43" y="36" width="31" height="14" rx="1.8" fill="#E8F1EC" stroke="#516172" stroke-width="0.32" />
      <text x="58.5" text-anchor="middle" font-family="Arial, Helvetica, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="2.998611" fill="#22313F" font-weight="normal" aria-label="Preparation"><tspan x="58.5" y="44.019528">Preparation</tspan></text></g>
    <g id="node-3-assay" data-node-id="assay">
      <title>Assay</title>
      <rect x="85" y="36" width="29" height="14" rx="1.8" fill="#E8F1EC" stroke="#516172" stroke-width="0.32" />
      <text x="99.5" text-anchor="middle" font-family="Arial, Helvetica, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="2.998611" fill="#22313F" font-weight="normal" aria-label="Assay"><tspan x="99.5" y="44.019528">Assay</tspan></text></g>
    <g id="node-4-analysis" data-node-id="analysis">
      <title>Analysis</title>
      <rect x="85" y="66" width="29" height="14" rx="1.8" fill="#E8F1EC" stroke="#516172" stroke-width="0.32" />
      <text x="99.5" text-anchor="middle" font-family="Arial, Helvetica, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="2.998611" fill="#22313F" font-weight="normal" aria-label="Analysis"><tspan x="99.5" y="74.019528">Analysis</tspan></text></g>
    <g id="node-5-result" data-node-id="result">
      <title>Result</title>
      <ellipse cx="58.5" cy="73" rx="15.5" ry="7" fill="#EEEAF7" stroke="#516172" stroke-width="0.32" />
      <text x="58.5" text-anchor="middle" font-family="Arial, Helvetica, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="2.998611" fill="#22313F" font-weight="normal" aria-label="Result"><tspan x="58.5" y="74.019528">Result</tspan></text></g>
    <g id="node-6-quality-control" data-node-id="quality-control">
      <title>Quality control</title>
      <rect x="43" y="7" width="31" height="14" rx="1.8" fill="#FBEDEC" stroke="#516172" stroke-width="0.32" />
      <text x="58.5" text-anchor="middle" font-family="Arial, Helvetica, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="2.998611" fill="#22313F" font-weight="normal" aria-label="Quality control"><tspan x="58.5" y="15.019528">Quality control</tspan></text></g>
    <g id="node-7-reference-database" data-node-id="reference-database">
      <title>Reference database</title>
      <path d="M 5 64 A 14.5 3 0 0 1 34 64 L 34 79 A 14.5 3 0 0 1 5 79 Z" fill="#FFF3DB" stroke="#516172" stroke-width="0.32" />
      <ellipse cx="19.5" cy="64" rx="14.5" ry="3" fill="#FFF3DB" stroke="#516172" stroke-width="0.32" />
      <text x="19.5" text-anchor="middle" font-family="Arial, Helvetica, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="2.998611" fill="#22313F" font-weight="normal" aria-label="Reference database"><tspan x="19.5" y="70.600417">Reference</tspan> <tspan x="19.5" y="74.438639">database</tspan></text></g>
  </g>
</svg>